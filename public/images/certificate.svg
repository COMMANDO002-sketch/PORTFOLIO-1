<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">CLASPTEK Certificate of Completion</title>
  <desc id="desc">A formal certificate matching the sample design.</desc>

  <defs>
    <style>
