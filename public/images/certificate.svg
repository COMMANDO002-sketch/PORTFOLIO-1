      .small { font-size: 11px; }
      .tiny { font-size: 9px; }
      .rule { stroke: #121212; stroke-width: 1.5; }
      .bar { stroke: #0d2c7e; stroke-width: 6; }
      .blue { fill: #0d2c7e; }
      .dark { fill: #111111; }
      .muted { fill: #2d2d2d; }
      .red { fill: #d80e0e; }
    </style>
  </defs>

  <rect width="800" height="600" fill="#f2f2f2"/>
  <rect x="12" y="12" width="776" height="576" fill="#f7f7f7" stroke="#d7d7d7" stroke-width="2"/>
  <line x1="0" y1="18" x2="800" y2="18" class="bar"/>
  <line x1="0" y1="582" x2="800" y2="582" class="bar"/>

